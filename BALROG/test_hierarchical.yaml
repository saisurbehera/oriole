# Test configuration for Hierarchical DreamCoder Agent
agent: 
  type: hierarchical         # Use our new hierarchical agent
  remember_cot: True         
  max_text_history: 16       
  max_image_history: 0       
  max_cot_history: 1         
  max_icl_history: 1000      
  cache_icl: False

eval:
  output_dir: "hierarchical_results"
  resume_from: null          
  num_workers: 1             # Use single worker for testing
  num_episodes:              
    nle: 2                   # Just 2 episodes for quick test
  max_steps_per_episode: 100 # Limit steps for quick test
  save_trajectories: True    
  save_images: False         
  icl_episodes: 1
  icl_dataset: records
  feedback_on_invalid_action: True

client:
  client_name: openai        
  model_id: meta-llama/Llama-3.2-1B-Instruct  # Available vLLM model
  base_url: http://0.0.0.0:8080/v1  # Your vLLM server
  generate_kwargs:
    temperature: 0.7         # Lower temperature for more consistent behavior
    max_tokens: 1024         # Smaller for testing
  timeout: 60                
  max_retries: 5             
  delay: 2                   
  alternate_roles: False     

envs:
  names: nle                 # Only test NetHack
  env_kwargs:
    seed: 42                 # Fixed seed for reproducible testing
  nle_kwargs:
    character: "@"           
    max_episode_steps: 100   # Short episodes for testing
    no_progress_timeout: 50  # Shorter timeout
    savedir: null            
    save_ttyrec_every: 0     
    skip_more: True          

tasks:
  nle_tasks:
    - NetHackChallenge-v0    # Single task for testing

hydra:
  run:
    dir: .                   
  output_subdir: null