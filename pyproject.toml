[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oriole"
version = "0.1.0"
description = "Play NetHack locally with Codex and a wiki knowledge graph"
requires-python = ">=3.10"
dependencies = ["nle==1.2.0", "gymnasium>=0.29,<2", "setuptools<81"]

[project.scripts]
oriole = "oriole.cli:main"

[tool.setuptools.packages.find]
include = ["oriole*"]
