name: Local game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked files and full history
        run: |
          git archive HEAD | tar -x -C "$(mktemp -d "$RUNNER_TEMP/tracked.XXXXXX")"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --config "$GITHUB_WORKSPACE/.gitleaks.toml" "$RUNNER_TEMP"/tracked.*
